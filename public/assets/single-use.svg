<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 570" width="100%" height="auto" role="img" aria-label="Single-Use Today diagram: illustrating how single-use foodware goes from restaurant to home to trash and into landfills or the environment">
  <defs>
    <!-- Path from Node 1 (160, 175) to Node 2 (320, 175) -> Arc to Node 3 (320, 335) -> Down to Node 4 (320, 445) -->
    <path id="single-use-active-track" d="M 160 175 L 320 175 A 80 80 0 0 1 320 335 L 320 445" fill="none" />
    <style>
      .single-use-bg { fill: #151515; stroke: #FFD100; stroke-width: 2.5; }
      .single-use-title { fill: #ffffff; font-family: 'Inclusive Sans', -apple-system, sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; }
      .single-use-subtitle { fill: #8e8e8e; font-family: 'Inclusive Sans', -apple-system, monospace, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 3px; text-anchor: middle; }
      .single-use-dashed-box { fill: none; stroke: #3e3e3e; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .single-use-step-label { fill: #ffffff; font-family: 'Inclusive Sans', -apple-system, sans-serif; font-size: 14px; font-weight: 400; }
      .single-use-step-num { fill: #000000; font-family: 'Inclusive Sans', -apple-system, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .single-use-never-text { fill: #888888; font-family: 'Inclusive Sans', -apple-system, sans-serif; font-size: 13px; font-style: italic; }
      .single-use-footer { fill: #ffffff; font-family: 'Inclusive Sans', -apple-system, sans-serif; font-size: 14px; font-weight: 500; text-anchor: middle; }
      @media (prefers-reduced-motion: reduce) {
        .animated-arrow-single { display: none; }
        .static-arrow-single { display: block !important; }
      }
    </style>
  </defs>

  <!-- Card Background with Yellow Border -->
  <rect class="single-use-bg" x="1.5" y="1.5" width="477" height="567" rx="20" />

  <!-- Title -->
  <text class="single-use-title" x="240" y="46">Single-Use Today</text>

  <!-- Column Subtitles -->
  <text class="single-use-subtitle" x="145" y="78">THE BUSINESS</text>
  <text class="single-use-subtitle" x="335" y="78">YOUR HOME</text>

  <!-- Dashed Bounding Box -->
  <rect class="single-use-dashed-box" x="36" y="98" width="408" height="282" rx="16" />

  <!-- Center Vertical Dividing Dashed Line -->
  <line class="single-use-dashed-box" x1="240" y1="98" x2="240" y2="380" />

  <!-- Dashed Return Track (The broken loop that never comes back) -->
  <line x1="320" y1="335" x2="160" y2="335" stroke="#444444" stroke-width="4" stroke-dasharray="8 8" />
  <path d="M 160 335 A 80 80 0 0 1 160 175" fill="none" stroke="#444444" stroke-width="4" stroke-dasharray="8 8" />

  <!-- (X) Never comes back indicator -->
  <g class="single-use-never-group">
    <circle cx="82" cy="255" r="14" fill="#1c1c1c" stroke="#555555" stroke-width="2" />
    <path d="M 76 249 L 88 261 M 88 249 L 76 261" stroke="#888888" stroke-width="2" stroke-linecap="round" />
    <text class="single-use-never-text" x="104" y="260">Never comes back</text>
  </g>

  <!-- Downward Line from Node 3 to Node 4 (Landfill) -->
  <line x1="320" y1="335" x2="320" y2="445" stroke="#D4A825" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 312 405 L 320 417 L 328 405" fill="none" stroke="#D4A825" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Active Solid Yellow Track (Node 1 -> Node 2 -> Node 3) -->
  <line x1="160" y1="175" x2="320" y2="175" stroke="#FFD100" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 320 175 A 80 80 0 0 1 320 335" fill="none" stroke="#FFD100" stroke-width="4.5" stroke-linecap="round" />

  <!-- Animated Flow Arrows: travel 1 -> 2 -> 3 -> 4, fading out at landfill -->
  <g class="animated-arrow-single">
    <path d="M -9 -7 L 7 0 L -9 7 Z" fill="#FFD100" />
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#single-use-active-track" />
    </animateMotion>
    <animate attributeName="opacity" values="0; 1; 1; 1; 0; 0" keyTimes="0; 0.05; 0.88; 0.96; 0.99; 1" dur="6s" repeatCount="indefinite" />
  </g>
  <g class="animated-arrow-single">
    <path d="M -9 -7 L 7 0 L -9 7 Z" fill="#FFD100" />
    <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" rotate="auto">
      <mpath href="#single-use-active-track" />
    </animateMotion>
    <animate attributeName="opacity" values="0; 1; 1; 1; 0; 0" keyTimes="0; 0.05; 0.88; 0.96; 0.99; 1" dur="6s" repeatCount="indefinite" />
  </g>

  <!-- Static Fallback Arrow -->
  <path class="static-arrow-single" d="M 235 168 L 249 175 L 235 182 Z" fill="#FFD100" style="display: none;" />

  <!-- Step 1: Restaurant serves -->
  <text class="single-use-step-label" x="160" y="150" text-anchor="middle">Restaurant serves</text>
  <circle cx="160" cy="175" r="16" fill="#FFD100" />
  <text class="single-use-step-num" x="160" y="175">1</text>

  <!-- Step 2: You take it home -->
  <text class="single-use-step-label" x="320" y="150" text-anchor="middle">You take it home</text>
  <circle cx="320" cy="175" r="16" fill="#FFD100" />
  <text class="single-use-step-num" x="320" y="175">2</text>

  <!-- Step 3: You toss it -->
  <circle cx="320" cy="335" r="16" fill="#FFD100" />
  <text class="single-use-step-num" x="320" y="335">3</text>
  <text class="single-use-step-label" x="345" y="360" text-anchor="start">You toss it</text>

  <!-- Step 4: Landfill or environment -->
  <circle cx="320" cy="445" r="16" fill="#555555" />
  <text class="single-use-step-num" x="320" y="445" fill="#151515">4</text>
  <text class="single-use-step-label" x="320" y="482" text-anchor="middle">Landfill or environment</text>

  <!-- Footer Caption -->
  <text class="single-use-footer" x="240" y="530">Used for minutes. Trash for centuries.</text>
</svg>
